# Postgres cho môi trường dev, MinIO (S3 local) chỉ bật khi cần chạy không có R2.
#
#   docker compose up -d                    # khởi động Postgres
#   docker compose --profile minio up -d    # thêm MinIO
#   docker compose down                     # dừng, giữ dữ liệu
#   docker compose down -v                  # dừng và xoá sạch dữ liệu
#
# Các biến POSTGRES_*, MINIO_* bên dưới đọc từ .env nếu có, không có thì dùng mặc định.

services:
  postgres:
    image: postgres:17-alpine
    container_name: theenglishjourney-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-theenglishjourney}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-theenglishjourney}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage tương thích S3 cho local: API ở :9000, trang quản trị ở :9001.
  # MinIO đã ngừng phát hành image bản cộng đồng, đây là bản đóng băng của Bitnami, chỉ dùng cho dev.
  # Dev và production dùng Cloudflare R2. Muốn quay lại MinIO thì đổi các biến S3_* trong .env theo .env.example.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: theenglishjourney-minio
    restart: unless-stopped
    profiles: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: theenglishjourney-public:download,theenglishjourney-private
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  postgres_data:
  minio_data:
